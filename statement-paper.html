<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Statement Paper — Exalyte</title>
<link rel="icon" href="images/exalyte.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500;700&family=Noto+Sans+Bengali:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--blue:#1a73e8;--blue-h:#1557b0;--red:#d93025;--bg:#f8f9fa;--surf:#fff;--hov:#f1f3f4;--border:#dadce0;--t1:#202124;--t2:#3c4043;--t3:#5f6368;
--gs:'Google Sans','Roboto','Noto Sans Bengali',system-ui,sans-serif;--rb:'Roboto','Noto Sans Bengali',system-ui,sans-serif;--r:4px}
html,body{height:100%;margin:0}
body{font-family:var(--rb);background:var(--bg);color:var(--t2);-webkit-font-smoothing:antialiased;overflow:hidden;display:flex;flex-direction:column}
.topbar{height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:var(--surf);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:32px;height:32px;border-radius:50%}
.brand b{font:500 1.1rem var(--gs);color:var(--t1);display:block;line-height:1.1}.brand small{font-size:.72rem;color:var(--t3)}
.actions{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;font:500 .85rem var(--gs);border-radius:var(--r);cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--blue)}
.btn:hover{background:#e8f0fe;border-color:var(--blue)}.btn.p{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.p:hover{background:var(--blue-h)}
.btn svg{width:16px;height:16px}
.tabs{flex:none;display:flex;background:var(--surf);border-bottom:1px solid var(--border)}
.tabs button{flex:1;padding:12px;border:0;background:none;font:500 .9rem var(--gs);color:var(--t3);border-bottom:2px solid transparent}
.tabs button.on{color:var(--blue);border-color:var(--blue)}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(360px,440px) 1fr}
#editor{overflow:auto;padding:12px;background:var(--surf);border-right:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.card{border:1px solid var(--border);border-radius:8px;padding:0 12px}
.card summary{padding:11px 0;font:500 .9rem var(--gs);color:var(--t1);cursor:pointer}
.card[open] summary{border-bottom:1px solid var(--border);margin-bottom:10px}
.card>label,.grid label{display:block;margin-bottom:10px;font-size:.75rem;color:var(--t3)}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
input[type=text],select,textarea{width:100%;margin-top:4px;padding:9px 10px;font:16px var(--rb);color:var(--t1);background:#fff;border:1px solid var(--border);border-radius:var(--r)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
.sw{display:flex!important;align-items:center;gap:8px;font-size:.85rem!important;color:var(--t2)!important}
.hd{display:flex;justify-content:space-between;font:500 .9rem var(--gs);color:var(--t1)}.hd span{font-weight:400;font-size:.75rem;color:var(--t3)}
.chips,.tools{display:flex;gap:6px;overflow-x:auto;flex:none;padding-bottom:2px}
.chip,.tools button{flex:none;border:1px solid var(--border);background:#fff;border-radius:999px;padding:6px 12px;font:500 .8rem var(--gs);color:var(--blue);cursor:pointer}
.tools button{color:var(--t2);border-radius:var(--r)}.tools .x{color:var(--red)}
textarea{flex:1;min-height:52vh;margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.5;resize:vertical;white-space:pre;overflow:auto}
.hint{font-size:.75rem;color:var(--t3);line-height:1.5;padding-bottom:8px}.hint code{background:var(--hov);padding:1px 4px;border-radius:3px}
#preview{overflow:auto;background:#e8eaed;padding:10px 0 40px}
#pageInfo{text-align:center;font:500 .75rem var(--gs);color:var(--t3);margin-bottom:10px}
#stage{margin:0 auto;position:relative}
#scaler{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;box-shadow:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15)}
#marks{position:absolute;left:0;right:0;top:0;pointer-events:none}
.mark{position:absolute;left:0;right:0;border-top:1px dashed var(--blue)}
.mark b{position:absolute;right:10px;top:-10px;background:var(--blue);color:#fff;font:700 15px var(--gs);padding:2px 12px;border-radius:999px}
/* ---------- the paper ---------- */
#paper{width:var(--pw);padding:var(--pm);font:var(--pfs)/1.6 var(--gs);color:var(--t1);background:#fff;position:relative}
.p-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.p-brand{display:flex;align-items:center;gap:10px;font-size:1.35em;font-weight:500}.p-brand img{width:38px;height:38px;border-radius:50%}
.p-tag{font-size:.7em;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);background:#e8f0fe;padding:5px 12px;border-radius:999px}
.p-rule{height:3px;background:var(--blue);border-radius:2px;margin:14px 0 18px}
.p-title{font-size:1.9em;font-weight:700;line-height:1.25}.p-sub{color:var(--t3);margin-top:4px}
.p-info{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.p-info span{border:1px solid var(--border);border-radius:6px;padding:3px 10px;font-size:.85em;background:var(--bg)}
.p-hr{border-top:1px solid var(--border);margin:18px 0}
#paperBody{overflow-wrap:anywhere}
#paperBody h1{font-size:1.6em;margin:.8em 0 .4em}#paperBody h2{font-size:1.3em;margin:1em 0 .5em;border-left:4px solid var(--blue);padding-left:10px}
#paperBody h3{font-size:1.1em;margin:.9em 0 .4em;color:var(--blue-h)}#paperBody p{margin:.6em 0}
#paperBody ul,#paperBody ol{padding-left:1.5em;margin:.6em 0}#paperBody li{margin:.2em 0}
#paperBody table{width:100%;border-collapse:collapse;margin:.8em 0}
#paperBody th,#paperBody td{border:1px solid var(--border);padding:7px 10px;text-align:left;vertical-align:top}
#paperBody th{background:#e8f0fe;color:#174ea6;font-weight:700}#paperBody tbody tr:nth-child(even) td{background:var(--bg)}
#paperBody blockquote{margin:.8em 0;padding:4px 14px;border-left:4px solid var(--border);color:var(--t3)}
#paperBody img{max-width:100%;height:auto}#paperBody pre,#paperBody code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em;background:var(--hov);border-radius:4px}
#paperBody code{padding:1px 5px}#paperBody pre{padding:10px 12px;white-space:pre-wrap}
#paperBody .note,#paperBody .warn,#paperBody .ok,#paperBody .err{margin:.8em 0;padding:10px 14px;border-radius:6px;border-left:4px solid var(--blue);background:#e8f0fe}
#paperBody .warn{border-color:#f9ab00;background:#fef7e0}#paperBody .ok{border-color:#1e8e3e;background:#e6f4ea}#paperBody .err{border-color:var(--red);background:#fce8e6}
#paperBody .cols-2,#paperBody .cols-3{display:grid;gap:16px;grid-template-columns:1fr 1fr}#paperBody .cols-3{grid-template-columns:1fr 1fr 1fr}
#paperBody .center{text-align:center}#paperBody .right{text-align:right}
#paperBody .mcq{margin:.7em 0}#paperBody .mcq p{margin:0 0 .3em}#paperBody .opts{display:grid;grid-template-columns:1fr 1fr;gap:3px 16px;margin-left:1.4em}
#paperBody .page-break{height:10px;border-top:2px dashed #bdc1c6;margin:6px 0}#paperBody .empty{color:var(--t3);text-align:center;padding:60px 0}
.capturing .page-break{border-top-color:transparent!important}
#busy{position:fixed;inset:0;background:rgba(32,33,36,.45);display:none;align-items:center;justify-content:center;z-index:50}#busy.on{display:flex}
#busy div{background:#fff;padding:20px 26px;border-radius:8px;font:500 .95rem var(--gs);color:var(--t1);display:flex;gap:12px;align-items:center}
#busy i{width:20px;height:20px;border:3px solid #e8f0fe;border-top-color:var(--blue);border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--t1);color:#fff;padding:10px 18px;border-radius:6px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw;text-align:center}#toast.on{opacity:1}
@media(max-width:999px){main{display:block}body[data-tab=write] #preview,body[data-tab=preview] #editor{display:none}main>section{height:100%}.p-hide{display:none}textarea{font-size:16px}}
@media(min-width:1000px){.tabs{display:none}}
</style>
</head>
<body data-tab="write">
<header class="topbar">
  <div class="brand"><img src="images/exalyte.png" alt="Exalyte"><div><b>Exalyte</b><small>Statement Paper</small></div></div>
  <div class="actions">
    <button class="btn" id="btnPng"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>PNG</button>
    <button class="btn p" id="btnPdf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>PDF</button>
  </div>
</header>
<nav class="tabs"><button data-t="write" class="on">Write</button><button data-t="preview">Preview</button></nav>

<section id="editor">
  <details class="card" open><summary>Paper header</summary>
    <label>Brand name<input type="text" id="fBrand"></label>
    <label>Title<input type="text" id="fTitle"></label>

<style id="userCss"></style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=id=>document.getElementById(id),KEY='exalyte_statement_v1';
const PAGES={a4:{w:794,h:1123,f:'a4'},letter:{w:816,h:1056,f:'letter'}};
const SAMPLE=`<h2>Section A — Periodic Motion</h2>
<p>Choose the correct answer. Each question carries <b>1 mark</b>; wrong answers lose <b>0.25</b>.</p>
<table>
<thead><tr><th>Quantity</th><th>Symbol</th><th>Formula</th><th>Unit</th></tr></thead>
<tbody>
<tr><td>Time period</td><td>T</td><td>2π√(m/k)</td><td>s</td></tr>
<tr><td>Frequency</td><td>f</td><td>1/T</td><td>Hz</td></tr>
<tr><td>Angular frequency</td><td>ω</td><td>2πf</td><td>rad s<sup>−1</sup></td></tr>
</tbody></table>
<h3>Key points</h3>
<ul><li>Acceleration in SHM is always towards the mean position.</li><li>Total energy: E = ½kA<sup>2</sup></li><li>সরল দোলন গতিতে ত্বরণ সাম্যাবস্থানের দিকে থাকে।</li></ul>
<div class="note"><b>Note:</b> Use g = 9.8 m s<sup>−2</sup> unless stated otherwise.</div>
<h3>Questions</h3>
<div class="mcq"><p><b>1.</b> The SI unit of frequency is —</p><div class="opts"><span>(A) second</span><span>(B) hertz</span><span>(C) metre</span><span>(D) newton</span></div></div>
<div class="mcq"><p><b>2.</b> If the amplitude doubles, the total energy becomes —</p><div class="opts"><span>(A) 2×</span><span>(B) 4×</span><span>(C) ½×</span><span>(D) same</span></div></div>`;
const SNIP={Heading:'<h2>Heading</h2>\n',Text:'<p>Your text here.</p>\n',Bullets:'<ul>\n  <li>Point one</li>\n  <li>Point two</li>\n</ul>\n',Numbered:'<ol>\n  <li>First</li>\n  <li>Second</li>\n</ol>\n',
Table:'<table>\n  <thead><tr><th>Head 1</th><th>Head 2</th><th>Head 3</th></tr></thead>\n  <tbody>\n    <tr><td>A</td><td>B</td><td>C</td></tr>\n    <tr><td>D</td><td>E</td><td>F</td></tr>\n  </tbody>\n</table>\n',
MCQ:'<div class="mcq"><p><b>1.</b> Question?</p><div class="opts"><span>(A) </span><span>(B) </span><span>(C) </span><span>(D) </span></div></div>\n',
'2 Columns':'<div class="cols-2">\n  <div>Left</div>\n  <div>Right</div>\n</div>\n',Note:'<div class="note"><b>Note:</b> text</div>\n',Warning:'<div class="warn"><b>Warning:</b> text</div>\n',
'x² / H₂O':'x<sup>2</sup> H<sub>2</sub>O','Image':'<img src="" alt="">\n','Page break':'<div class="page-break"></div>\n'};
let S={brand:'Exalyte',title:'Physics — Periodic Motion',sub:'Statement paper · HSC Admission Model Test',info:'Class: HSC | Date: 12 Oct 2026 | Time: 40 min | Marks: 40',header:true,page:'a4',margin:'48',font:'15',html:SAMPLE};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const F={fBrand:'brand',fTitle:'title',fSub:'sub',fInfo:'info',sPage:'page',sMargin:'margin',sFont:'font',html:'html'};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function prepare(raw){
  raw=raw.trim();if(!raw)return{html:'',css:''};
  if(!/<[a-z!\/][^>]*>/i.test(raw)){const d=document.createElement('div');d.style.whiteSpace='pre-wrap';d.textContent=raw;return{html:d.outerHTML,css:''}}
  const doc=new DOMParser().parseFromString(raw,'text/html');let css='';
  doc.querySelectorAll('style').forEach(s=>{css+=s.textContent+'\n';s.remove()});
  doc.querySelectorAll('script,iframe,object,embed,link,meta,base,title').forEach(n=>n.remove());
  doc.body.querySelectorAll('*').forEach(el=>{[...el.attributes].forEach(a=>{if(/^on/i.test(a.name)||(/^(href|src|xlink:href)$/i.test(a.name)&&/^\s*javascript:/i.test(a.value)))el.removeAttribute(a.name)})});
  return{html:doc.body.innerHTML,css};
}
function rt(r){
  if(r.type===1){const sel=r.selectorText.split(',').map(s=>{s=s.trim();return/^(html|body|:root)$/i.test(s)?'#paperBody':'#paperBody '+s.replace(/^(html|body)\s+/i,'')}).join(',');return sel+'{'+r.style.cssText+'}'}
  if(r.type===4)return'@media '+r.media.mediaText+'{'+[...r.cssRules].map(rt).join('')+'}';
  if(r.type===12)return'@supports '+r.conditionText+'{'+[...r.cssRules].map(rt).join('')+'}';
  return r.cssText;
}
function scopeCSS(css){
  if(!css.trim())return'';const st=document.createElement('style');st.media='not all';st.textContent=css;document.head.appendChild(st);
  let out='';try{out=[...st.sheet.cssRules].map(rt).join('\n')}catch(e){}st.remove();return out;
}
let scale=1;
function render(){
  const P=PAGES[S.page],paper=$('paper');
  paper.style.cssText=`--pw:${P.w}px;--pm:${S.margin}px;--pfs:${S.font}px;min-height:${P.h}px`;
  $('pHead').style.display=S.header?'':'none';
  $('pBrand').textContent=S.brand||'Exalyte';
  $('pTitle').textContent=S.title;$('pTitle').style.display=S.title?'':'none';
  $('pSub').textContent=S.sub;$('pSub').style.display=S.sub?'':'none';
  $('pInfo').innerHTML='';S.info.split('|').map(s=>s.trim()).filter(Boolean).forEach(t=>{const s=document.createElement('span');s.textContent=t;$('pInfo').appendChild(s)});
  const{html,css}=prepare(S.html);
  $('paperBody').innerHTML=html||'<p class="empty">Nothing to show yet — paste HTML in the Write tab.</p>';
  $('userCss').textContent=scopeCSS(css);
  $('count').textContent=S.html.length?S.html.length.toLocaleString()+' chars':'';
  fit();requestAnimationFrame(marks);
}
function fit(){
  const pv=$('preview'),P=PAGES[S.page],avail=pv.clientWidth-(innerWidth<600?16:48);if(avail<=0)return;
  scale=Math.min(1,avail/P.w);$('scaler').style.transform=`scale(${scale})`;$('scaler').style.width=P.w+'px';
  $('stage').style.width=P.w*scale+'px';$('stage').style.height=$('paper').offsetHeight*scale+'px';
}
function breaks(el,M,pch){
  const r0=el.getBoundingClientRect(),sc=(r0.width/el.offsetWidth)||1,rel=v=>Math.round((v-r0.top)/sc),H=el.offsetHeight;
  const B=new Set(),T=new Set(),forced=[];
  const add=(e,nb)=>{const r=e.getBoundingClientRect();if(r.height<1)return;if(!nb)B.add(rel(r.bottom));T.add(rel(r.top))};
  (function walk(p){for(const c of p.children){
    const cs=getComputedStyle(c);if(cs.display==='none'||cs.position==='absolute')continue;
    if(c.matches('.page-break,.pb')){const r=c.getBoundingClientRect();forced.push({top:rel(r.top),bottom:rel(r.bottom)});continue}
    if(['page','always','left','right'].includes(cs.breakBefore)||cs.pageBreakBefore==='always'){const t=rel(c.getBoundingClientRect().top);forced.push({top:t,bottom:t})}
    const tag=c.tagName;add(c,/^H[1-6]$/.test(tag));
    if(tag==='TABLE')c.querySelectorAll('tbody tr,tfoot tr').forEach(x=>add(x));
    else if(tag==='UL'||tag==='OL')[...c.children].forEach(x=>add(x));
    else if(/^(DIV|SECTION|ARTICLE|MAIN|BLOCKQUOTE|ASIDE|FIGURE|DETAILS)$/.test(tag)&&!/flex|grid/.test(cs.display)&&cs.columnCount==='auto')walk(c);
  }})(el);
  const Bs=[...B].sort((a,b)=>a-b),Ts=[...T].sort((a,b)=>a-b),end=H-M,segs=[];
  const nextTop=c=>{const t=Ts.find(t=>t>=c-1);return t!==undefined&&t-c<80?Math.max(t,c):c};
  let start=M,n=0;
  while(start<end-2&&n++<300){
    const sk=forced.find(f=>f.top<=start+2&&f.bottom>start);if(sk){start=sk.bottom;continue}
    const lim=start+pch;let cut;
    if(lim>=end)cut=end;else{
      const f=forced.find(f=>f.top>start+2&&f.top<=lim);
      if(f){segs.push([start,f.top]);start=Math.max(f.bottom,f.top+1);continue}
      let best=-1;for(const b of Bs){if(b>lim)break;if(b>start+pch*.25)best=b}
      cut=best>0?best:lim;
    }
    segs.push([start,cut]);start=nextTop(cut);
  }
  return segs.length?segs.filter(s=>s[1]-s[0]>=2):[[M,Math.max(end,M+2)]];
}
function marks(){
  const paper=$('paper'),box=$('marks');box.innerHTML='';if(!paper.offsetHeight)return;
  const P=PAGES[S.page],M=+S.margin,segs=breaks(paper,M,P.h-2*M);
  $('pageInfo').textContent=segs.length+(segs.length>1?' pages':' page')+' · '+(S.page==='a4'?'A4':'Letter');
  segs.slice(1).forEach((s,i)=>{const d=document.createElement('div');d.className='mark';d.style.top=segs[i][1]+'px';d.innerHTML='<b>Page '+(i+2)+'</b>';box.appendChild(d)});
  $('stage').style.height=paper.offsetHeight*scale+'px';
}
/* ---------- export ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function busy(m){$('busy').classList.toggle('on',!!m);$('busyMsg').textContent=m||''}
function host(h,off){
  const d=document.createElement('div');d.setAttribute('data-capture','1');
  d.style.cssText=`position:fixed;left:0;top:0;width:${PAGES[S.page].w}px;background:#fff;z-index:-1;pointer-events:none;`+(h?`height:${h}px;overflow:hidden`:'');
  const p=$('paper').cloneNode(true);p.classList.add('capturing');p.style.position='relative';p.style.top=off?-off+'px':'0';d.appendChild(p);document.body.appendChild(d);return{d,p};
}
async function ready(root){
  try{await document.fonts.ready}catch(e){}
  await Promise.all([...root.querySelectorAll('img')].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r;setTimeout(r,6000)})));
}
function snap(el,sc,h){
  return html2canvas(el,{scale:sc,useCORS:true,backgroundColor:'#ffffff',logging:false,width:PAGES[S.page].w,height:h,windowWidth:PAGES[S.page].w+200,windowHeight:h+100,scrollX:0,scrollY:0,
    onclone:doc=>{doc.documentElement.style.height='auto';doc.body.style.cssText='margin:0;overflow:visible;height:auto;display:block;background:#fff';
      [...doc.body.children].forEach(n=>{if(!n.hasAttribute('data-capture')&&!/^(SCRIPT|STYLE)$/.test(n.tagName))n.style.display='none'})}});
}
function name(){return'exalyte-'+((S.title||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'statement-paper')}
function saveBlob(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
function guard(){
  if(!window.html2canvas||!window.jspdf){toast('PDF tools could not load — check your internet');return false}
  if(!S.html.trim()){toast('Add some HTML first');return false}return true;
}
async function makePDF(){
  if(!guard())return;busy('Preparing PDF…');
  try{
    await sleep(40);const P=PAGES[S.page],M=+S.margin;
    const m=host();await ready(m.d);const segs=breaks(m.p,M,P.h-2*M);m.d.remove();
    const pdf=new jspdf.jsPDF({unit:'pt',format:P.f,compress:true});
    const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),f=pw/P.w,ascii=/^[\x20-\x7E]*$/.test(S.brand||'Exalyte');
    for(let i=0;i<segs.length;i++){
      busy(`Rendering page ${i+1} of ${segs.length}…`);await sleep(30);
      const[a,b]=segs[i],h=b-a,c=host(h,a);await ready(c.d);
      const cv=await snap(c.d,2.5,h);c.d.remove();
      if(i)pdf.addPage();
      pdf.addImage(cv.toDataURL('image/jpeg',.95),'JPEG',0,M*f,pw,h*f);
      pdf.setFont('helvetica','normal');pdf.setFontSize(8);pdf.setTextColor(95,99,104);
      const y=ph-M*f/2+3;if(ascii)pdf.text(S.brand||'Exalyte',M*f,y);
      pdf.text(`Page ${i+1} of ${segs.length}`,pw-M*f,y,{align:'right'});
    }
    saveBlob(pdf.output('blob'),name()+'.pdf');toast('PDF ready ✓');
  }catch(e){console.error(e);toast('Could not create PDF — try again')}
  busy('');
}
async function makePNG(){
  if(!guard())return;busy('Preparing PNG…');
  try{
    await sleep(40);const P=PAGES[S.page],m=host();await ready(m.d);const H=m.p.offsetHeight;
    const sc=Math.min(2,Math.sqrt(16e6/(P.w*H)));const cv=await snap(m.d,sc,H);m.d.remove();
    cv.toBlob(b=>{saveBlob(b,name()+'.png');toast(sc<1.4?'PNG saved (reduced quality — very long paper)':'PNG ready ✓')},'image/png');
  }catch(e){console.error(e);toast('Could not create PNG — try again')}
  busy('');
}
/* ---------- wiring ---------- */
let tm;const later=()=>{clearTimeout(tm);tm=setTimeout(render,250)};
for(const[id,k]of Object.entries(F)){const el=$(id);el.value=S[k];el.addEventListener('input',()=>{S[k]=el.value;save();later()})}
$('sHeader').checked=S.header;$('sHeader').onchange=e=>{S.header=e.target.checked;save();render()};
$('sPage').onchange=$('sMargin').onchange=$('sFont').onchange=render;
Object.keys(SNIP).forEach(k=>{const b=document.createElement('button');b.className='chip';b.textContent=k;b.onclick=()=>{
  const t=$('html'),s=t.selectionStart??t.value.length;t.setRangeText(SNIP[k],s,t.selectionEnd??s,'end');S.html=t.value;save();render();toast(k+' added')};$('chips').appendChild(b)});
$('bSample').onclick=()=>{$('html').value=S.html=SAMPLE;save();render()};
$('bClear').onclick=()=>{if(S.html&&!confirm('Clear all HTML?'))return;$('html').value=S.html='';save();render()};
$('bCopy').onclick=()=>navigator.clipboard.writeText(S.html).then(()=>toast('Copied'),()=>toast('Copy failed'));
$('bPaste').onclick=()=>navigator.clipboard.readText().then(t=>{$('html').value=S.html=t;save();render();toast('Pasted')},()=>toast('Long-press the box and choose Paste'));
$('btnPdf').onclick=makePDF;$('btnPng').onclick=makePNG;
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.body.dataset.tab=b.dataset.t;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));requestAnimationFrame(()=>{fit();marks()})});
addEventListener('resize',()=>{fit();marks()});
$('paperBody').addEventListener('load',()=>{fit();marks()},true);
document.fonts&&document.fonts.ready.then(()=>{fit();marks()});
$('sPage').value=S.page;$('sMargin').value=S.margin;$('sFont').value=S.font;
render();
</script>
